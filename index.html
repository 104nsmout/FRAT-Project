<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<body>
<title>FRAT Preflight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: stacked full-screen phone views that slide over one another; one-column question flow with thumb-zone answers. Single dark cockpit look by choice. */
:root {
  --bg: #050505;
  --panel: #0B0B0A;
  --panel-2: #141412;
  --line: #262623;
  --line-2: #3A3A36;
  --fg: #F4F4F0;
  --fg-2: #D8D8D2;
  --muted: #B4B4AE;
  --dim: #9A9A94;
  --faint: #6E6E68;
  --accent: #F5C518;
  --ink: #0A0A0A;
  --warn: #FF8C28;
  --bad: #FF6A3D;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.22,.8,.24,1);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--display); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; transition: transform .14s ease, background-color .2s ease, border-color .2s ease, color .2s ease, opacity .2s ease; }
button:active:not(:disabled) { transform: scale(.97); }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { position: relative; max-width: 440px; height: 100%; margin: 0 auto; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; background: var(--bg); overflow: hidden; }
.screen.leaving { pointer-events: none; }
.screen > *:not(.topo) { position: relative; z-index: 1; }
.topo { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.mono { font-family: var(--mono); letter-spacing: 0.14em; text-transform: uppercase; }
.lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.icon-btn { width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
.icon-btn .n { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--ink); font-family: var(--mono); font-size: 10px; line-height: 18px; text-align: center; }
.route { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; color: var(--muted); text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.5; }
.prog { display: flex; flex-direction: column; gap: 8px; }
.prog-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; }
.bar { height: 4px; border-radius: 2px; background: #22221F; overflow: hidden; }
.bar > i { display: block; height: 4px; background: var(--accent); animation: barw .5s var(--ease) both; }
@keyframes barw { from { width: var(--from); } }
.q-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.fig { border-radius: 22px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.fig svg { display: block; width: 100%; height: auto; }
.fig-pad { padding: 12px; }
h1.q { margin: 0; font-size: clamp(22px, 6.6vw, 28px); line-height: 1.12; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
.q-sub { margin: -6px 0 0; font-size: 15px; color: var(--muted); }
.answers { display: flex; flex-direction: column; gap: 10px; }
.opt { width: 100%; min-height: 64px; padding: 0 22px; border-radius: 20px; border: 2px solid #2E2E2A; background: rgba(20,20,18,0.92); color: var(--fg); font-size: 20px; font-weight: 700; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
.opt.tall { min-height: 76px; font-size: 21px; }
.opt .sub { display: block; font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; color: var(--dim); margin-top: 2px; }
.opt.on, .seg.on, .tile.on, .rcc.on { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.opt.on .sub { color: rgba(10,10,10,0.7); }
.sev { display: flex; align-items: flex-end; gap: 3px; height: 20px; flex-shrink: 0; }
.sev i { display: block; width: 5px; border-radius: 2px; background: var(--line-2); }
.sev i.f { background: currentColor; }
.opt.on .sev i { background: rgba(10,10,10,0.25); }
.opt.on .sev i.f { background: var(--ink); }
.seat-row { display: flex; align-items: center; gap: 10px; }
.seat-row .who { width: 64px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; }
.seg { flex: 1 1 0; min-width: 0; min-height: 62px; border-radius: 18px; border: 2px solid #2E2E2A; background: rgba(20,20,18,0.92); font-size: 18px; font-weight: 700; cursor: pointer; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { min-width: 0; min-height: 92px; padding: 12px 6px 10px; border-radius: 18px; border: 2px solid #2E2E2A; background: rgba(20,20,18,0.92); display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px; text-align: center; font-size: 14px; font-weight: 700; line-height: 1.15; cursor: pointer; white-space: pre-line; }
.tile.ghost { background: transparent; border-color: var(--line-2); }
.rcc-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.rcc { min-width: 0; min-height: 86px; padding: 10px 0 8px; border-radius: 16px; border: 2px solid #2E2E2A; background: rgba(20,20,18,0.92); display: flex; flex-direction: column; align-items: center; justify-content: space-between; cursor: pointer; }
.rcc b { font-size: 26px; font-weight: 900; line-height: 1; }
.rcc small { font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; }
.rcc em { display: block; width: 22px; height: 5px; border-radius: 3px; }
.ghost-btn { min-height: 56px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--fg); font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; }
.primary { min-height: 76px; border: 0; border-radius: 999px; background: var(--accent); color: var(--ink); font-size: 23px; font-weight: 900; letter-spacing: 0.04em; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; }
.primary:disabled { opacity: 0.35; cursor: default; }
.primary.big { min-height: 88px; font-size: 27px; }
.textbtn { align-self: center; min-height: 44px; padding: 0 14px; border: 0; background: transparent; color: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line-2); cursor: pointer; }
.foot { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; padding-top: 4px; }
.chip { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.14em; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.chip.clear { color: var(--fg-2); background: #1F1F1D; border: 1px solid var(--line-2); }
.chip.flag { color: var(--ink); background: var(--warn); }
.chip.low { color: var(--fg); background: #1F1F1D; border: 1px solid #5E5E58; }
.chip.elev { color: var(--ink); background: var(--accent); }
.chip.high { color: var(--ink); background: var(--bad); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field input, textarea { width: 100%; min-height: 48px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--panel); color: var(--fg); padding: 10px 14px; font-family: var(--mono); font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; }
textarea { font-family: var(--display); text-transform: none; letter-spacing: 0; resize: none; min-height: 72px; font-size: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rows { display: flex; flex-direction: column; border-top: 1px solid #1F1F1D; }
.row { min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-bottom: 1px solid #1F1F1D; background: transparent; color: var(--fg); text-align: left; cursor: pointer; padding: 0; width: 100%; }
.row .l { display: flex; align-items: center; gap: 12px; min-width: 0; }
.scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding-bottom: 6px; }
.sheet-wrap { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; z-index: 10; }
.sheet { width: 100%; background: var(--panel-2); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 12px max(20px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet .grab { align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin-bottom: 6px; }
.toast { position: absolute; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--ink); font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; padding: 10px 16px; border-radius: 999px; z-index: 20; white-space: nowrap; }
pre.summary { margin: 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--fg-2); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; user-select: text; overflow-x: auto; }

/* Home — Debrief-style */
.brand { display: flex; align-items: center; gap: 12px; }
.brand .word { font-size: 30px; font-weight: 900; letter-spacing: 0.14em; }
.home-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.eyebrow { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
.hero { margin: 0; font-size: clamp(42px, 12.5vw, 54px); line-height: 1.0; font-weight: 800; letter-spacing: -0.015em; }
.last { margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.last i { width: 18px; height: 1px; background: #5A5A55; }
.last b { font-weight: 500; color: var(--fg-2); }
.home-foot { display: flex; flex-direction: column; gap: 14px; }
.flightline { width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; text-align: left; }
.flightline .fl { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.flightline .fl b { font-family: var(--mono); font-weight: 500; font-size: 15px; letter-spacing: 0.1em; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.offline { margin: 0; text-align: center; font-family: var(--mono); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
.offline i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 10px; vertical-align: 1px; }

/* Hold-before-advance cue: a line sweeps across the chosen answer */
.opt, .seg, .tile, .rcc { position: relative; overflow: hidden; }
.sweep { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(10,10,10,0.55); transform-origin: 0 50%; animation: sweep linear both; pointer-events: none; }
@keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* Motion */
.screen.enter .st { animation: rise .38s var(--ease) both; animation-delay: calc(60ms + var(--i, 0) * 45ms); }
.pop { animation: pop .34s var(--ease); }
@keyframes pop { 0% { transform: scale(.97); } 55% { transform: scale(1.012); } 100% { transform: none; } }
.a-draw { animation: draw .55s var(--ease) both; }
@keyframes draw { from { stroke-dashoffset: var(--len); } }
.a-grow { transform-box: fill-box; transform-origin: 0% 50%; animation: growX .55s var(--ease) both; }
@keyframes growX { from { transform: scaleX(0); } }
.a-growY { transform-box: fill-box; transform-origin: 50% 100%; animation: growY .55s var(--ease) both; }
@keyframes growY { from { transform: scaleY(0); } }
.a-swing { animation: swing .6s var(--ease) both; }
@keyframes swing { from { transform: rotate(var(--from)); } }
.a-move { animation: move .6s var(--ease) both; }
@keyframes move { from { transform: translate(var(--fx), var(--fy)); } }
.a-fade { animation: fade .45s ease both; }
@keyframes fade { from { opacity: 0; } }
.a-pop { transform-box: fill-box; transform-origin: 50% 50%; animation: popin .4s var(--ease) both; }
@keyframes popin { from { opacity: 0; transform: scale(.82); } }
.a-rise { animation: rise .4s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="app"></div>

<script>
(function () {
'use strict';

/* ===== Scoring — PLACEHOLDER values. Replace with the safety manager's table. ===== */
var SCORING = {
  levelPts: { 1: 0, 2: 2, 3: 5, 4: 8 },
  seatLowPts: 3,
  multiItemPts: 3,
  rccPts: { 6: 0, 5: 1, 4: 2, 3: 4, 2: 6, 1: 8, 0: 10 },
  bands: { elevated: 8, high: 16 } /* score >= elevated → ELEVATED; >= high → HIGH */
};

var A = '#F5C518', WARN = '#FF8C28', BAD = '#FF6A3D';
var EASE = 'cubic-bezier(.22,.8,.24,1)';
var reduce = false; try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
var store = {
  get: function (k, d) { try { var v = localStorage.getItem('frat.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('frat.' + k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('frat.' + k); } catch (e) {} }
};

var EXAMPLE_FLIGHT = { dep: 'KHCR', arr: 'KDEN', tail: 'N680XX', pic: 'CAPT', sic: 'F/O', etd: '0800', example: true };
var S = {
  view: 'home',
  flight: store.get('flight', EXAMPLE_FLIGHT),
  draft: store.get('draft', null),
  history: store.get('history', []),
  lastProg: 0
};
var app = document.getElementById('app');
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

/* ===== Animation context: PREV = answer before this change (null on a full screen render) ===== */
var PREV = null, ANIM = true;
function an(cls) { return ANIM ? cls : ''; }
function isNew(k) { return PREV == null || !(PREV.indexOf && PREV.indexOf(k) >= 0); }
function dly(ms) { return ms ? 'animation-delay:' + ms + 'ms;' : ''; }

/* ===== Shared SVG bits ===== */
function sevBars(level, max) {
  var h = max === 4 ? [6, 10, 15, 20] : [8, 13, 18], out = '';
  for (var i = 0; i < h.length; i++) out += '<i class="' + (level > i ? 'f' : '') + '" style="height:' + h[i] + 'px"></i>';
  return '<span class="sev" aria-hidden="true">' + out + '</span>';
}
function topo(kind) {
  var paths = {
    rings: '<ellipse cx="320" cy="280" rx="70" ry="46" transform="rotate(25 320 280)"/><ellipse cx="320" cy="280" rx="130" ry="86" transform="rotate(25 320 280)" stroke-dasharray="6 6"/><ellipse cx="320" cy="280" rx="200" ry="132" transform="rotate(25 320 280)"/><ellipse cx="320" cy="280" rx="280" ry="186" transform="rotate(25 320 280)"/>',
    ringsL: '<ellipse cx="60" cy="260" rx="80" ry="50" transform="rotate(-12 60 260)"/><ellipse cx="60" cy="260" rx="140" ry="92" transform="rotate(-12 60 260)" stroke-dasharray="6 6"/><ellipse cx="60" cy="260" rx="210" ry="140" transform="rotate(-12 60 260)"/><ellipse cx="60" cy="260" rx="290" ry="196" transform="rotate(-12 60 260)"/>',
    waves: '<path d="M-20 180 C 70 220, 150 140, 230 190 S 360 240, 420 180"/><path d="M-20 230 C 80 270, 160 190, 240 240 S 370 290, 420 230" stroke-dasharray="6 6"/><path d="M-20 280 C 90 320, 170 240, 250 290 S 380 340, 420 280"/><path d="M-20 330 C 100 370, 180 290, 260 340 S 390 390, 420 330"/>'
  };
  return '<svg class="topo" aria-hidden="true" viewBox="0 0 390 844" preserveAspectRatio="xMidYMin slice" fill="none" stroke="#191917" stroke-width="1.2">' + (paths[kind] || paths.rings) + '</svg>';
}

/* Home background: real contour lines (marching squares over a smooth height field) */
var homeTopoCache = null;
function homeTopo() {
  if (homeTopoCache) return homeTopoCache;
  var W = 390, H = 844, cs = 12, nx = Math.ceil(W / cs) + 1, ny = Math.ceil(H / cs) + 1, vals = [], i, j;
  var bump = function (x, y, cx, cy, sx, sy, a) { var dx = (x - cx) / sx, dy = (y - cy) / sy; return a * Math.exp(-(dx * dx + dy * dy) / 2); };
  var f = function (x, y) {
    return bump(x, y, 245, 430, 120, 150, 1.2) + bump(x, y, 40, 130, 110, 120, 0.8) + bump(x, y, 360, 810, 130, 140, 0.75) + bump(x, y, 110, 650, 90, 110, -0.55) +
      0.12 * Math.sin(x / 390 * 7 + y / 844 * 5) + 0.08 * Math.sin(x / 390 * 13 - y / 844 * 9);
  };
  var mn = Infinity, mx = -Infinity;
  for (j = 0; j < ny; j++) for (i = 0; i < nx; i++) { var v = f(i * cs, j * cs); vals.push(v); if (v < mn) mn = v; if (v > mx) mx = v; }
  var T = { 1: [[3, 2]], 2: [[2, 1]], 3: [[3, 1]], 4: [[0, 1]], 5: [[3, 0], [2, 1]], 6: [[0, 2]], 7: [[3, 0]], 8: [[3, 0]], 9: [[0, 2]], 10: [[0, 1], [3, 2]], 11: [[0, 1]], 12: [[3, 1]], 13: [[2, 1]], 14: [[3, 2]] };
  var NL = 15, solid = '', dashed = '';
  for (var k = 0; k < NL; k++) {
    var L = mn + (mx - mn) * (k + 0.5) / NL, seg = '';
    for (j = 0; j < ny - 1; j++) for (i = 0; i < nx - 1; i++) {
      var a = vals[j * nx + i], b = vals[j * nx + i + 1], c = vals[(j + 1) * nx + i + 1], d = vals[(j + 1) * nx + i];
      var idx = (a > L ? 8 : 0) | (b > L ? 4 : 0) | (c > L ? 2 : 0) | (d > L ? 1 : 0);
      if (!T[idx]) continue;
      var P = [[(i + (L - a) / (b - a)) * cs, j * cs], [(i + 1) * cs, (j + (L - b) / (c - b)) * cs], [(i + (L - d) / (c - d)) * cs, (j + 1) * cs], [i * cs, (j + (L - a) / (d - a)) * cs]];
      T[idx].forEach(function (e) { seg += 'M' + P[e[0]][0].toFixed(1) + ' ' + P[e[0]][1].toFixed(1) + 'L' + P[e[1]][0].toFixed(1) + ' ' + P[e[1]][1].toFixed(1); });
    }
    if (k % 4 === 2) dashed += seg; else solid += seg;
  }
  homeTopoCache = '<svg class="topo" aria-hidden="true" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" fill="none" stroke-width="1.2" stroke-linecap="round">' +
    '<path d="' + solid + '" stroke="#1C1C1A"/><path d="' + dashed + '" stroke="#252523" stroke-dasharray="5 5"/>' +
    '<path d="M0 300 H390 M0 590 H390 M300 0 V844" stroke="#1C1C1A" stroke-dasharray="4 8"/>' +
    '<g fill="#272725" font-family="JetBrains Mono, monospace" font-size="13"><text x="208" y="356" transform="rotate(62 208 356)">4200</text><text x="296" y="694" transform="rotate(-24 296 694)">4600</text><text x="36" y="236" transform="rotate(-10 36 236)">5200</text></g></svg>';
  return homeTopoCache;
}

var planeTop = '<path d="M1 8 L8 6.6 L14 1 H17 L14.5 6.4 L27 6.2 L30 3 H32.5 L31 8 L32.5 13 H30 L27 9.8 L14.5 9.6 L17 15 H14 L8 9.4 Z"/>';
function sovereign(id, gear, ice, iceCls) {

  var offline = false; try { offline = !!(navigator.serviceWorker && navigator.serviceWorker.controller); } catch (e) {}

  return '<div class="screen home">' + homeTopo() +
    '<div class="top' + st(0) + '"><div class="brand">' + IC.tri + '<span class="word">FRAT</span></div>' +
    '<div style="display:flex;align-items:center;gap:14px"><span class="mono" style="font-size:13px;color:#9A9A94">' + dateStr(Date.now()) + '</span><button class="icon-btn" data-act="history" aria-label="Past FRATs">' + IC.hist + (S.history.length ? '<span class="n">' + S.history.length + '</span>' : '') + '</button></div></div>' +
    '<main class="home-main"><p class="eyebrow' + st(1) + '">Pre-flight risk</p><h1 class="hero' + st(2) + '">Assess it.<br>Brief it.<br>Go fly.</h1><p class="last' + st(3) + '"><span>Last FRAT</span><i></i>' + lastTxt + '</p></main>' +
    '<div class="home-foot">' +
    '<button class="flightline' + st(4) + '" data-act="edit" aria-label="Edit flight details"><span class="fl"><span class="lbl" style="font-size:10px;color:' + (f.example ? 'var(--accent)' : 'var(--dim)') + '">' + (f.example ? 'Example flight · tap to set yours' : 'Next flight · ETD ' + esc(f.etd)) + '</span><b>' + esc(f.dep) + ' → ' + esc(f.arr) + ' · ' + esc(f.tail) + '</b></span>' + IC.pencil + '</button>' +
    (d ? '<button class="primary big' + st(5) + '" data-act="resume">RESUME · ' + String(resumeN).padStart(2, '0') + '/' + TOTAL + ' ' + IC.arrow + '</button>'
       : '<button class="primary big' + st(5) + '" data-act="start">' + IC.plus + ' START FRAT</button>') +
    (d ? '<button class="textbtn' + st(6) + '" data-act="restart">Start a new FRAT</button>'
       : '<p class="offline' + st(6) + '"><i></i>' + (offline ? 'Offline ready' : 'Saved on this phone') + '</p>') +
    '</div></div>';
}

function viewHistory() {
  var rows = S.history.map(function (h, i) {
    return '<button class="row' + st(Math.min(i, 8) + 1) + '" data-act="hist" data-i="' + i + '"><span class="l" style="flex-direction:column;align-items:flex-start;gap:4px"><b style="font-size:17px">' + esc(h.flight.dep) + ' → ' + esc(h.flight.arr) + '</b><span class="lbl" style="font-size:10px">' + dateStr(h.ts) + ' · ' + esc(h.flight.tail) + ' · ' + h.score + ' PTS</span></span><span style="display:flex;align-items:center;gap:10px"><span class="chip ' + h.band + '">' + BAND_TEXT[h.band] + '</span>' + IC.chev + '</span></button>';
  }).join('');
  return '<div class="screen">' + header(blank, '<span style="color:var(--accent)">PAST FRATS</span>', '<button class="icon-btn" data-act="home-down" aria-label="Close">' + IC.x + '</button>') +
    '<div class="scroll">' + (rows ? '<div class="rows">' + rows + '</div><p class="lbl" style="text-align:center;font-size:10px;margin:4px 0 0">Last 50 · stored on this phone</p>'

    '</div></div>';
}

function viewEdit() {
  var f = S.flight, fld = function (id, label, val, ph) { return '<div class="field"><label class="lbl" for="f-' + id + '">' + label + '</label><input id="f-' + id + '" data-f="' + id + '" value="' + esc(f.example ? '' : val) + '" placeholder="' + esc(ph) + '" autocomplete="off" autocapitalize="characters" maxlength="12"></div>'; };
  return '<div class="screen">' + header(blank, '<span style="color:var(--accent)">FLIGHT DETAILS</span>', '<button class="icon-btn" data-act="home-down" aria-label="Close">' + IC.x + '</button>') +
    '<form class="scroll" id="flight-form"><div class="grid2' + st(1) + '">' + fld('dep', 'Departure', f.dep, 'KHCR') + fld('arr', 'Arrival', f.arr, 'KDEN') + fld('tail', 'Tail', f.tail, 'N680XX') + fld('etd', 'ETD (local)', f.etd, '0800') + fld('pic', 'PIC', f.pic, 'Last name') + fld('sic', 'SIC', f.sic, 'Last name') + '</div>' +
    '<button class="primary' + st(2) + '" type="submit">SAVE FLIGHT</button></form></div>';
}

function viewQuestion() {
  var d = S.draft, i = d.idx, q = Q[i], a = d.ans[q.id], n = i + 1;
  ANIM = PREV == null || JSON.stringify(PREV) !== JSON.stringify(a);
  var body = '', k = 3;
  if (q.kind === 'single') {
    var max = q.opts.length > 3 ? 4 : 3, tall = q.opts.length <= 2;
    body = '<div class="answers" role="radiogroup" aria-label="' + esc(q.title) + '">' + q.opts.map(function (o) {
      return '<button class="opt' + (tall ? ' tall' : '') + (a === o.id ? ' on' : '') + st(k++) + '" role="radio" aria-checked="' + (a === o.id) + '" data-act="pick" data-v="' + o.id + '"><span>' + esc(o.label) + (o.sub ? '<span class="sub">' + esc(o.sub) + '</span>' : '') + '</span>' + sevBars(o.level, max) + '</button>';
    }).join('') + '</div>';
  } else if (q.kind === 'seats') {
    var sa = a || {};
    body = '<div class="answers">' + q.seats.map(function (s) {
      return '<div class="seat-row' + st(k++) + '" role="radiogroup" aria-label="' + s.who + '"><span class="who"><span class="mono" style="font-size:12px">' + s.who + '</span><span class="mono" style="font-size:10px;color:#9A9A94">' + s.note + '</span></span>' +
        '<button class="seg' + (sa[s.key] === 'ok' ? ' on' : '') + '" role="radio" aria-checked="' + (sa[s.key] === 'ok') + '" data-act="seat" data-k="' + s.key + '" data-v="ok">' + s.ok + '</button>' +
        '<button class="seg' + (sa[s.key] === 'low' ? ' on' : '') + '" role="radio" aria-checked="' + (sa[s.key] === 'low') + '" data-act="seat" data-k="' + s.key + '" data-v="low">' + s.low + '</button></div>';
    }).join('') + '</div>';
  } else if (q.kind === 'multi') {
    var ma = a || [];
    var tiles = q.items.map(function (it) { var on = ma.indexOf(it.key) >= 0;
      return '<button class="tile' + (on ? ' on' : '') + st(k++) + '" aria-pressed="' + on + '" data-act="toggle" data-v="' + it.key + '"><svg aria-hidden="true" width="30" height="26" viewBox="0 0 34 30" fill="none" stroke="' + (on ? '#0A0A0A' : '#E8E8E2') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + it.icon + '"/></svg>' + esc(it.label) + '</button>'; }).join('');
    var noneOn = ma.indexOf('none') >= 0;
    var noneBtn = q.wide ? '<button class="opt' + (noneOn ? ' on' : '') + st(k++) + '" style="justify-content:center;--i:' + (k - 1) + '" aria-pressed="' + noneOn + '" data-act="none" data-v="none">' + q.noneLabel + '</button>'
      : '<button class="tile ghost' + (noneOn ? ' on' : '') + st(k++) + '" aria-pressed="' + noneOn + '" data-act="none" data-v="none"><svg aria-hidden="true" width="30" height="26" viewBox="0 0 34 30" fill="none" stroke="' + (noneOn ? '#0A0A0A' : '#E8E8E2') + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 15 L14 21 L26 9"/></svg>' + q.noneLabel + '</button>';
    body = '<div class="answers"><div class="tiles">' + tiles + (q.wide ? '' : noneBtn) + '</div>' + (q.wide ? noneBtn : '') +
      '<button class="primary' + st(k++) + '" style="min-height:60px;font-size:19px;--i:' + (k - 1) + '" data-act="next"' + (ma.length ? '' : ' disabled') + '>CONTINUE ' + IC.arrow + '</button></div>';
  } else if (q.kind === 'rcc') {
    body = '<div class="answers"><div class="rcc-row' + st(k++) + '" role="radiogroup" aria-label="Runway condition code">' + RCC.map(function (c) { var on = a === c.n;
      return '<button class="rcc' + (on ? ' on' : '') + '" role="radio" aria-checked="' + on + '" aria-label="RCC ' + c.n + ', ' + c.word + '" data-act="pick" data-v="' + c.n + '"><b>' + c.n + '</b><small>' + c.short + '</small><em style="background:' + c.color + '"></em></button>'; }).join('') +
      '</div><div class="lbl' + st(k++) + '" style="display:flex;justify-content:space-between;font-size:10px;--i:' + (k - 1) + '"><span>Dry · best</span><span>Nil · worst</span></div></div>';
  }
  var sc = total(d.ans), b = band(sc);
  var html = '<div class="screen">' + (q.topo !== 'none' ? topo(q.topo) : '') +
    header('<button class="icon-btn" data-act="back" aria-label="Back">' + IC.back + '</button>', routeText(), '<button class="icon-btn" data-act="exit" aria-label="Exit FRAT">' + IC.x + '</button>') +
    '<div class="prog"><div class="prog-row"><span style="color:var(--accent)">' + String(n).padStart(2, '0') + ' / ' + TOTAL + '</span><span style="color:#9A9A94">' + q.sec.toUpperCase() + '</span></div><div class="bar"><i style="width:' + (n / TOTAL * 100).toFixed(2) + '%;--from:' + (S.lastProg * 100).toFixed(2) + '%"></i></div></div>' +
    '<div class="q-main"><div class="fig' + st(0) + '">' + G[q.g](a) + '</div><h1 class="q' + st(1) + '">' + esc(q.title) + '</h1>' + (q.sub ? '<p class="q-sub' + st(2) + '">' + esc(q.sub) + '</p>' : '') + '</div>' +
    body + '<div class="foot' + st(k) + '"><span style="color:#9A9A94">RISK SO FAR</span><span>' + sc + ' PTS · <span style="color:' + (b === 'high' ? BAD : b === 'elev' ? A : '#E8E8E2') + '">' + BAND_TEXT[b] + '</span></span></div></div>';
  ANIM = true;
  return html;
}

function reviewTarget(sec) {
  var qs = Q.filter(function (q) { return q.sec === sec; });
  var miss = qs.filter(function (q) { return !answered(q, S.draft.ans[q.id]); })[0];
  return Q.indexOf(miss || qs[0]);
}
function viewReview() {
  var d = S.draft, sc = total(d.ans), b = band(sc), needle = Math.max(-84, Math.min(84, -84 + (sc / (SCORING.bands.high * 1.5)) * 168));
  var missing = Q.filter(function (q) { return !answered(q, d.ans[q.id]); });
  var rows = SECTIONS.map(function (sec, si) {
    var qs = Q.filter(function (q) { return q.sec === sec; }), first = Q.indexOf(qs[0]), last = Q.indexOf(qs[qs.length - 1]);
    var nf = 0, miss = 0; qs.forEach(function (q) { nf += qScore(q, d.ans[q.id]).flags.length; if (!answered(q, d.ans[q.id])) miss++; });
    var range = String(first + 1).padStart(2, '0') + (last > first ? '–' + String(last + 1).padStart(2, '0') : '');
    return '<button class="row' + st(si + 2) + '" data-act="jump" data-sec="' + sec + '"><span class="l"><span class="mono" style="font-size:11px;color:#9A9A94;width:46px">' + range + '</span><b style="font-size:17px">' + sec + '</b></span><span style="display:flex;align-items:center;gap:10px"><span class="chip ' + (miss ? 'high' : nf ? 'flag' : 'clear') + '">' + (miss ? miss + ' MISSING' : nf ? nf + ' FLAGGED' : 'CLEAR') + '</span>' + IC.chev + '</span></button>';
  }).join('');
  var flags = []; Q.forEach(function (q) { qScore(q, d.ans[q.id]).flags.forEach(function (f) { flags.push(f); }); });
  return '<div class="screen">' + header('<button class="icon-btn" data-act="back" aria-label="Back">' + IC.back + '</button>', '<span style="color:var(--accent)">20 / 20 · REVIEW</span><br>' + routeText(), '<button class="icon-btn" data-act="exit" aria-label="Exit FRAT">' + IC.x + '</button>') +
    '<div class="prog"><div class="bar"><i style="width:100%;--from:' + (S.lastProg * 100).toFixed(2) + '%"></i></div></div>' +
    '<div class="scroll"><section class="st" style="--i:0;display:flex;flex-direction:column;align-items:center;gap:4px" aria-label="Total risk"><svg viewBox="0 0 260 140" style="width:min(260px,80%)" role="img" aria-label="Total risk gauge"><path d="M22 128 A108 108 0 0 1 84.3 30.1" fill="none" stroke="#5E5E58" stroke-width="16"/><path d="M88.6 28.2 A108 108 0 0 1 171.4 28.2" fill="none" stroke="' + A + '" stroke-opacity="0.85" stroke-width="16"/><path d="M175.7 30.1 A108 108 0 0 1 238 128" fill="none" stroke="' + BAD + '" stroke-width="16"/><g class="a-swing" style="transform:rotate(' + needle.toFixed(0) + 'deg);transform-origin:130px 128px;--from:-84deg;animation-delay:200ms;animation-duration:.9s"><path d="M130 128 L126 124 L130 40 L134 124 Z" fill="#F4F4F0"/></g><circle cx="130" cy="128" r="9" fill="#141412" stroke="#4A4A45" stroke-width="1.5"/></svg>' +
    '<b style="font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums">' + sc + ' <span style="font-size:18px;color:#9A9A94">PTS</span></b><span class="chip ' + b + '">' + BAND_TEXT[b] + '</span></section>' +
    '<div class="rows">' + rows + '</div>' +
    (flags.length ? '<section class="st" style="--i:7;display:flex;flex-direction:column;gap:6px" aria-label="Flagged items"><span class="lbl">Flagged</span>' + flags.map(function (f) { return '<span style="font-size:15px;color:var(--fg-2)">— ' + esc(f) + '</span>'; }).join('') + '</section>' : '') +
    '<div class="field st" style="--i:8"><label class="lbl" for="comments">Pilot comments · ' + (b === 'low' ? 'optional' : 'mitigations') + '</label><textarea id="comments" placeholder="Mitigations, notes for the chief pilot…">' + esc(d.comments) + '</textarea></div>' +
    (b === 'high' ? '<p class="st" style="--i:9;margin:0;padding:10px 14px;border-radius:14px;background:rgba(255,106,61,0.14);border:1px solid #FF6A3D;font-size:14px;color:#FFB8A0">High risk: route to the chief pilot for approval before release.</p>' : '') +
    (missing.length ? '<p style="margin:0;font-size:14px;color:#FFB8A0">' + missing.length + ' question' + (missing.length > 1 ? 's' : '') + ' still open. Tap a section to finish.</p>' : '') +
    '<button class="primary st" style="--i:10" data-act="submit"' + (missing.length ? ' disabled' : '') + '>' + (b === 'high' ? 'SUBMIT FOR APPROVAL' : 'SUBMIT FRAT') + '</button></div></div>';
}

function summaryText(h) {
  var lines = ['FRAT — ' + h.flight.dep + ' → ' + h.flight.arr + ' · ' + h.flight.tail, new Date(h.ts).toLocaleString(), 'PIC ' + h.flight.pic + ' · SIC ' + h.flight.sic, 'Score: ' + h.score + ' pts (' + BAND_TEXT[h.band] + ')', ''];
  if (h.flags.length) { lines.push('Flagged:'); h.flags.forEach(function (f) { lines.push(' - ' + f); }); } else lines.push('No items flagged.');
  if (h.comments) { lines.push('', 'Comments: ' + h.comments); }
  lines.push('', '(Prototype — placeholder scoring)');
  return lines.join('\n');
}
function viewDone() {
  var h = S.viewing, fromHist = S.doneFrom === 'history';
  return '<div class="screen">' + topo('rings') + header(fromHist ? '<button class="icon-btn" data-act="to-history" aria-label="Back to past FRATs">' + IC.back + '</button>' : blank, esc(h.flight.dep) + ' → ' + esc(h.flight.arr) + ' · ' + esc(h.flight.tail), fromHist ? blank : '<button class="icon-btn" data-act="home-down" aria-label="Close">' + IC.x + '</button>') +
    '<div class="scroll" style="justify-content:center"><div class="st" style="--i:0;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center"><span class="lbl" style="color:var(--accent)">' + (fromHist ? dateStr(h.ts) : 'FRAT submitted') + '</span><b style="font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums">' + h.score + '</b><span class="chip ' + h.band + '">' + BAND_TEXT[h.band] + '</span></div>' +
    '<pre class="summary st" style="--i:1" id="summary">' + esc(summaryText(h)) + '</pre>' +
    '<button class="primary st" style="--i:2" data-act="copy">COPY SUMMARY</button><p class="lbl st" style="--i:3;text-align:center;font-size:10px;margin:0">Paste into FltSafety comments or a text to the chief pilot</p>' +
    (fromHist ? '' : '<button class="ghost-btn st" style="--i:4" data-act="home-down">Done</button>') + '</div></div>';
}

/* ===== Motion: screen transitions ===== */
function viewHTML() {
  return S.view === 'home' ? viewHome() : S.view === 'edit' ? viewEdit() : S.view === 'history' ? viewHistory() : S.view === 'q' ? viewQuestion() : S.view === 'review' ? viewReview() : viewDone();
}
function bindScreen(scr) {
  var form = scr.querySelector('#flight-form');
  if (form) form.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = {}; Array.prototype.forEach.call(form.querySelectorAll('input'), function (inp) { f[inp.dataset.f] = (inp.value || inp.placeholder).trim().toUpperCase(); });
    S.flight = f; store.set('flight', f); go('home', 'down'); toast('Flight saved');
  });
  var ta = scr.querySelector('#comments');
  if (ta) ta.addEventListener('input', function () { S.draft.comments = ta.value; saveDraft(); });
}
function go(view, dir) { S.view = view; render(dir); }
function render(dir) {
  var old = app.querySelector('.screen:not(.leaving)');
  PREV = null;
  var tmp = document.createElement('div'); tmp.innerHTML = viewHTML();
  var scr = tmp.firstElementChild;
  scr.classList.add('enter');
  app.appendChild(scr); bindScreen(scr);
  if (S.view === 'q') S.lastProg = (S.draft.idx + 1) / TOTAL; else if (S.view === 'review') S.lastProg = 1; else S.lastProg = 0;
  setTimeout(function () { scr.classList.remove('enter'); }, 1000);
  if (!old) return;
  old.classList.add('leaving');
  if (reduce || !dir || !scr.animate) { old.remove(); return; }
  var H = { duration: 340, easing: EASE, fill: 'both' }, V = { duration: 420, easing: EASE, fill: 'both' }, a1, a2;
  if (dir === 'fwd') {
    a1 = scr.animate([{ transform: 'translateX(100%)' }, { transform: 'none' }], H);
    a2 = old.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateX(-28%)', opacity: 0.3 }], H);
  } else if (dir === 'back') {
    old.style.zIndex = 2;
    a1 = scr.animate([{ transform: 'translateX(-28%)', opacity: 0.3 }, { transform: 'none', opacity: 1 }], H);
    a2 = old.animate([{ transform: 'none' }, { transform: 'translateX(100%)' }], H);
  } else if (dir === 'up') {
    scr.style.zIndex = 2;
    a1 = scr.animate([{ transform: 'translateY(100%)' }, { transform: 'none' }], V);
    a2 = old.animate([{ opacity: 1 }, { opacity: 0.3 }], V);
  } else if (dir === 'down') {
    old.style.zIndex = 2;
    a1 = scr.animate([{ opacity: 0.3 }, { opacity: 1 }], V);
    a2 = old.animate([{ transform: 'none' }, { transform: 'translateY(100%)' }], { duration: 360, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'both' });
  } else {
    a1 = scr.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, fill: 'both' });
    a2 = old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, fill: 'both' });
  }
  a2.onfinish = function () { old.remove(); };
  a1.onfinish = function () { a1.cancel(); scr.style.zIndex = ''; };
}
/* In-place update after an answer: swap graphic, answers and footer so the graphic animates */
function refresh(prev, popSel) {
  var scr = app.querySelector('.screen:not(.leaving)'); if (!scr) return;
  scr.classList.remove('enter');
  PREV = prev === undefined ? null : prev;
  var tmp = document.createElement('div'); tmp.innerHTML = viewQuestion();
  PREV = null;
  var n = tmp.firstElementChild;
  ['.fig', '.answers', '.foot'].forEach(function (sel) { var a = scr.querySelector(sel), b = n.querySelector(sel); if (a && b) a.parentNode.replaceChild(b, a); });
  var p = popSel ? scr.querySelector(popSel) : null;
  if (p) { p.classList.add('pop'); try { p.focus({ preventScroll: true }); } catch (e) {} }
  return p;
}

/* ===== Sheets + toast ===== */
function sheetHTML(kind) {
  if (kind === 'exit') return '<b style="font-size:22px">Leave this FRAT?</b><p style="margin:0;color:var(--muted);font-size:15px">Your answers stay saved as a draft. Resume it from the home screen.</p><button class="primary" data-act="sheet-close" style="min-height:62px;font-size:19px">KEEP GOING</button><button class="ghost-btn" data-act="leave">Leave and save draft</button><button class="ghost-btn" data-act="discard" style="color:#FFB8A0;border-color:#5A2E24">Discard answers</button>';
  return '<b style="font-size:22px">Start a new FRAT?</b><p style="margin:0;color:var(--muted);font-size:15px">The draft in progress will be discarded.</p><button class="primary" data-act="restart-yes" style="min-height:62px;font-size:19px">START NEW</button><button class="ghost-btn" data-act="sheet-close">Keep the draft</button>';
}
function openSheet(kind) {
  var exist = app.querySelector('.sheet-wrap'); if (exist) exist.remove();
  var w = document.createElement('div'); w.className = 'sheet-wrap'; w.dataset.act = 'sheet-close';
  w.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Confirm"><span class="grab" aria-hidden="true"></span>' + sheetHTML(kind) + '</div>';
  app.appendChild(w);
  if (!reduce && w.animate) {
    w.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
    w.firstChild.animate([{ transform: 'translateY(100%)' }, { transform: 'none' }], { duration: 380, easing: EASE });
  }
  var b = w.querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) {}
}
function closeSheet(cb) {
  var w = app.querySelector('.sheet-wrap:not(.closing)');
  if (!w) { if (cb) cb(); return; }
  w.classList.add('closing');
  if (reduce || !w.animate) { w.remove(); if (cb) cb(); return; }
  w.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: 'both' });
  var a = w.firstChild.animate([{ transform: 'none' }, { transform: 'translateY(100%)' }], { duration: 260, easing: 'cubic-bezier(.4,0,1,1)', fill: 'both' });
  a.onfinish = function () { w.remove(); };
  if (cb) setTimeout(cb, 120);
}
var toastT;
function toast(msg) {
  var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; app.appendChild(t);
  if (!reduce && t.animate) t.animate([{ opacity: 0, transform: 'translate(-50%, 10px)' }, { opacity: 1, transform: 'translate(-50%, 0)' }], { duration: 260, easing: EASE });
  setTimeout(function () { if (!reduce && t.animate) { var a = t.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, fill: 'both' }); a.onfinish = function () { t.remove(); }; } else t.remove(); }, 1700);
}

/* ===== Flow ===== */
function saveDraft() { store.set('draft', S.draft); }
function startFrat() { S.draft = { ans: {}, idx: 0, comments: '', started: Date.now(), seenReview: false }; saveDraft(); S.lastProg = 0; go('q', 'fwd'); }
function nextTarget() {
  var d = S.draft;
  if (d.seenReview) { for (var j = d.idx + 1; j < Q.length; j++) if (!answered(Q[j], d.ans[Q[j].id])) return j; return 'review'; }
  return d.idx < Q.length - 1 ? d.idx + 1 : 'review';
}
/* Hold after an answer: let the graphic finish, dwell (longer when the answer adds risk), then move on.
   A sweep line on the chosen answer shows the hold; a tap anywhere skips it. */
var HOLD = { dwellSafe: 450, dwellFlag: 1100, minSafe: 950, minFlag: 1750 };
var holdT = null, holding = false;
function goNext() {
  if (S.view !== 'q') return;
  var t = nextTarget();
  if (t === 'review') { S.draft.seenReview = true; saveDraft(); go('review', 'fwd'); }
  else { S.draft.idx = t; saveDraft(); go('q', 'fwd'); }
}
function clearHold() { clearTimeout(holdT); holding = false; var s = app.querySelector('.sweep'); if (s) s.remove(); }
function skipHold() { clearHold(); goNext(); }
function startHold(btn, flagged) {
  clearHold();
  var end = 600, fig = app.querySelector('.screen:not(.leaving) .fig');
  try {
    fig.getAnimations({ subtree: true }).forEach(function (an) {
      var t = an.effect.getComputedTiming(), left = (t.endTime || 0) - (an.currentTime || 0);
      if (left > end && left < 4000) end = left;
    });
  } catch (e) {}
  var dur = reduce ? (flagged ? 1200 : 700) : Math.max(Math.round(end + (flagged ? HOLD.dwellFlag : HOLD.dwellSafe)), flagged ? HOLD.minFlag : HOLD.minSafe);
  if (btn) { var sw = document.createElement('span'); sw.className = 'sweep'; sw.setAttribute('aria-hidden', 'true'); sw.style.animationDuration = dur + 'ms'; btn.appendChild(sw); }
  holding = true;
  holdT = setTimeout(function () { holding = false; goNext(); }, dur);
}
function isFlagged(q) { return qScore(q, S.draft.ans[q.id]).pts > 0; }
function clone(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }

app.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || !app.contains(el)) { if (holding && S.view === 'q' && !e.target.closest('.sheet-wrap')) skipHold(); return; }
  if (el.closest('.screen.leaving') || el.closest('.sheet-wrap.closing')) return;
  if (el.classList.contains('sheet-wrap') && e.target !== el) return;
  var act = el.dataset.act, d = S.draft, q = d && S.view === 'q' ? Q[d.idx] : null, prev;
  switch (act) {
    case 'start': startFrat(); break;
    case 'restart': openSheet('restart'); break;
    case 'restart-yes': closeSheet(startFrat); break;
    case 'resume': S.lastProg = 0; go(d.seenReview && allAnswered(d) ? 'review' : 'q', 'fwd'); break;
    case 'edit': go('edit', 'up'); break;
    case 'history': go('history', 'up'); break;
    case 'home-down': go('home', 'down'); break;
    case 'to-history': go('history', 'back'); break;
    case 'pick':
      var pv = q.kind === 'rcc' ? Number(el.dataset.v) : el.dataset.v;
      if (holding && d.ans[q.id] === pv) { skipHold(); break; } /* tap the chosen answer again to move on */
      prev = clone(d.ans[q.id]);
      d.ans[q.id] = pv; saveDraft();
      startHold(refresh(prev, '[data-v="' + el.dataset.v + '"]'), isFlagged(q)); break;
    case 'seat':
      if (holding && (d.ans[q.id] || {})[el.dataset.k] === el.dataset.v) { skipHold(); break; }
      clearHold();
      prev = clone(d.ans[q.id]) || {};
      var sa = Object.assign({}, d.ans[q.id] || {}); sa[el.dataset.k] = el.dataset.v; d.ans[q.id] = sa; saveDraft();
      var sb = refresh(prev, '[data-k="' + el.dataset.k + '"][data-v="' + el.dataset.v + '"]');
      if (sa.pic && sa.sic) startHold(sb, isFlagged(q));
      break;
    case 'toggle':
      clearHold();
      prev = clone(d.ans[q.id]) || [];
      var cur = d.ans[q.id] || [], v = el.dataset.v, ma = cur.filter(function (x) { return x !== 'none' && x !== v; });
      if (cur.indexOf(v) < 0) ma.push(v);
      d.ans[q.id] = ma; saveDraft(); refresh(prev, '[data-v="' + v + '"]'); break;
    case 'none':
      if (holding && (d.ans[q.id] || [])[0] === 'none') { skipHold(); break; }
      prev = clone(d.ans[q.id]) || []; d.ans[q.id] = ['none']; saveDraft();
      startHold(refresh(prev, '[data-act="none"]'), false); break;
    case 'next': skipHold(); break;
    case 'back':
      clearHold();
      if (S.view === 'review') { d.idx = Q.length - 1; saveDraft(); go('q', 'back'); }
      else if (d.idx > 0) { d.idx--; saveDraft(); go('q', 'back'); }
      else go('home', 'back');
      break;
    case 'jump': d.idx = reviewTarget(el.dataset.sec); saveDraft(); go('q', 'back'); break;
    case 'exit': clearHold(); openSheet('exit'); break;
    case 'sheet-close': closeSheet(); break;
    case 'leave': clearHold(); closeSheet(function () { go('home', 'back'); }); break;
    case 'discard': clearHold(); S.draft = null; store.del('draft'); closeSheet(function () { go('home', 'back'); }); break;
    case 'submit':
      var sc = total(d.ans), flags = []; Q.forEach(function (qq) { qScore(qq, d.ans[qq.id]).flags.forEach(function (f) { flags.push(f); }); });
      var rec = { ts: Date.now(), flight: Object.assign({}, S.flight), score: sc, band: band(sc), flags: flags, comments: d.comments, ans: d.ans };
      S.history.unshift(rec); S.history = S.history.slice(0, 50); store.set('history', S.history);
      S.draft = null; store.del('draft'); S.viewing = rec; S.doneFrom = 'submit'; go('done', 'up'); break;
    case 'hist': S.viewing = S.history[Number(el.dataset.i)]; S.doneFrom = 'history'; go('done', 'fwd'); break;
    case 'copy':
      var text = summaryText(S.viewing), pre = app.querySelector('.screen:not(.leaving) #summary');
      var fallback = function () { try { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (err) {} toast('Selected. Copy from the menu'); };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback); else fallback(); } catch (err) { fallback(); }
      break;
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && app.querySelector('.sheet-wrap')) closeSheet(); });

if (S.draft && S.draft.idx >= Q.length) S.draft.idx = Q.length - 1;
render(null);
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
})();
</script>
